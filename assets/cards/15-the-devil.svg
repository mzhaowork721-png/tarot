    <circle cx="111" cy="325" r="7" fill="#f2c14e" opacity="0.7" /><circle cx="225" cy="303" r="8" fill="#5b6cff" opacity="0.7" /><circle cx="109" cy="281" r="7" fill="#f2c14e" opacity="0.7" /><circle cx="331" cy="398" r="4" fill="#f2c14e" opacity="0.7" /><circle cx="316" cy="356" r="7" fill="#5b6cff" opacity="0.7" /><circle cx="236" cy="357" r="4" fill="#5b6cff" opacity="0.7" /><circle cx="193" cy="274" r="4" fill="#5b6cff" opacity="0.7" /><circle cx="107" cy="185" r="5" fill="#f2c14e" opacity="0.7" /><circle cx="295" cy="344" r="8" fill="#5b6cff" opacity="0.7" /><circle cx="133" cy="356" r="5" fill="#7b5cff" opacity="0.7" /><circle cx="295" cy="192" r="8" fill="#7b5cff" opacity="0.7" /><circle cx="199" cy="402" r="5" fill="#5b6cff" opacity="0.7" /><circle cx="324" cy="322" r="4" fill="#7b5cff" opacity="0.7" /><circle cx="270" cy="298" r="6" fill="#5b6cff" opacity="0.7" /><circle cx="122" cy="210" r="5" fill="#f2c14e" opacity="0.7" /><circle cx="157" cy="333" r="6" fill="#7b5cff" opacity="0.7" /><circle cx="207" cy="180" r="4" fill="#5b6cff" opacity="0.7" /><circle cx="239" cy="411" r="6" fill="#f2c14e" opacity="0.7" />
