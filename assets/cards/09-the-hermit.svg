  <rect x="18" y="18" width="384" height="684" rx="16" ry="16"
        fill="none" stroke="#7b5cff" stroke-width="2" />

  <!-- 顶部装饰 -->
  <rect x="30" y="30" width="360" height="2" fill="#f2c14e" opacity="0.5" />
  <circle cx="210" cy="60" r="8" fill="#f2c14e" />

  <!-- 中央图案区域 -->
  <g id="centralPattern">
    <polygon points="174,291.5 147.5,344.5 200.5,344.5"
